<main class="auth-page">
  <form class="auth-form" (ngSubmit)="login()">
    <span class="eyebrow">Acesso ao sistema</span>
    <h1>Entrar</h1>
    <p>Use seus dados para acessar o painel de produtos.</p>

    <label for="email">E-mail</label>
    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="seu@email.com"
      required
    />

    <label for="password">Senha</label>
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Sua senha"
      required
    />

    @if (errorMessage) {
      <p class="message error">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="loading">{{ loading ? 'Entrando...' : 'Entrar' }}</button>
    <p>Não possui cadastro? <a routerLink="/register">Cadastre-se</a></p>
  </form>
</main>
