<app-navbar />
<main class="page">
  @if (product) {
    <div class="page-header">
      <div>
        <span class="eyebrow">Detalhes do produto</span>
        <h1>{{ product.name }}</h1>
        <p>Preço atual: R$ {{ product.price | number: '1.2-2' }}</p>
      </div>
      <a class="secondary-button button" routerLink="/produtos">Voltar</a>
    </div>

    <form class="product-form" (ngSubmit)="updateProduct()">
      <h2>Editar produto</h2>
      <div class="form-grid">
        <label>Nome<input type="text" name="name" [(ngModel)]="name" required /></label>
        <label>
          Preço<input type="number" name="price" [(ngModel)]="price" min="0" step="0.01" required />
        </label>
      </div>
      <div class="actions">
        <button type="submit">Salvar alterações</button>
        <button class="danger-button" type="button" (click)="deleteProduct()">Excluir produto</button>
      </div>
    </form>
  } @else {
    <h1>Produto</h1>
    <p>{{ errorMessage || 'Carregando produto...' }}</p>
    <a class="back-link" routerLink="/produtos">Voltar para produtos</a>
  }

  @if (errorMessage && product) {
    <p class="message error">{{ errorMessage }}</p>
  }
</main>
